[package]
name = "tardrop"
version = "0.1.0"
edition = "2024"
description = "A safe, user-local installer for portable application archives"
license = "GPL-3.0-or-later"

[dependencies]
# gtk4 provides the native toolkit: real widgets, the system file dialog, and Wayland/X11
# drag-and-drop, all through GTK's own main loop.
gtk4 = { version = "0.11", features = ["v4_10"] }
anyhow = "1.0"
thiserror = "2.0"
# Archive readers used by the format-specific, path-validated extractors.
tar = "0.4"
flate2 = "1.1"
xz2 = "0.1"
bzip2 = "0.6"
zip = { version = "5.1", default-features = false, features = ["deflate", "bzip2", "xz", "zstd", "aes-crypto"] }
walkdir = "2.5"
dirs = "6.0"
sha2 = "0.10"
tempfile = "3.23"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
adw = { version = "0.9", package = "libadwaita", features = ["v1_6"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
